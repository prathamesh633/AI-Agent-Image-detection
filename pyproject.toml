[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-agent"
version = "0.1.0"
description = "Diagram-to-draw.io Reconstruction Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
vision = [
    "easyocr>=1.7.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
]
llm = [
    "google-generativeai>=0.3.0",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*"]
